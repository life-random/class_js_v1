<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch02 - index01.html 파일</h1>

    <script>
      // 1. let : 변경이 가능한 값을 담는 상자
      let username = "홍길동"; // username에 홍길동이라는 문자열 값을 담는다
      console.log(username);

      username = "티모";
      console.log(username);

      // 2. const : 한 번 정하면 바뀌지 않는 값을 담는 상자 (상수)
      const PI = 3.14;
      console.log(PI);

      // 3. const 상자는 한 번 값을 넣으면 다시 넣을 수 없다
      // PI = 3.14159;

      // 4. 한 페이지 안에서 같은 변수를 선언 한다면?
      // let username = "다른사람";     오류 발생

      // 5.
      let anything = 100;
      anything = "어제는 문자열";
      console.log(anything);
    </script>
  </body>
</html>
