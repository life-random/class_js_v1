<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../reset.css" />
    <style>
      /* 1단계 : 리셋 + 전역 스타일 */
      body {
        font-family: Arial, Helvetica, sans-serif;
        color: #333;
        padding: 20px;
      }

      /* 2단게 : 레이아웃 (큰 틀 배치) */
      .banner-container {
        display: flex;
        align-items: center;
        width: 80%;
        max-width: 600px;
        margin: 50px auto;
        border: 2px solid black;
      }
      .image-wrapper {
        flex: 1;
        height: 200px;
        overflow: hidden;
      }
      .image-track {
        display: flex;
        height: 100%;
        transition: transform 0.5s ease;
      }
      .image-wrapper img {
        flex: 0 0 100%;
        display: flex;
        object-fit: cover;
      }

      /* 3단계 컴포넌트 스타일 */
      .banner-container {
        border: 2px solid black;
      }
      .control-btn {
        padding: 20px;
        background: none;
        border: none;
        font-size: 20px;
      }

      /* 4단계 세부 조정 */
      .image-wrapper {
        transition: transform 0.5s ease; /* 부드러운 전환 효과 */
      }
      /* .image-wrapper img {
        opacity: 0;
        visibility: hidden;

        transition: opacity 0.5s ease-in-out;
      }
      .image-wrapper img.active {
        opacity: 1;
        visibility: visible;
      } */
      .control-btn {
        cursor: pointer;
        transition: transform 0.2s ease;
      }
      .control-btn:hover {
        scale: 1.3;
      }
      /* 5단게 반응형 처리 */
    </style>
  </head>
  <body>
    <h1>ch16 index04.html - 배너 변경</h1>

    <div class="banner-container">
      <button class="control-btn prev-btn">&lt;</button>

      <div class="image-wrapper">
        <div class="image-track">
          <img src="https://picsum.photos/id/20/400/300" />
          <img src="https://picsum.photos/id/30/400/300" />
          <img src="https://picsum.photos/id/40/400/300" />
        </div>
      </div>

      <button class="control-btn next-btn">&gt;</button>
    </div>

    <script>
      const prevButton = document.querySelector(".prev-btn");
      const nextButton = document.querySelector(".next-btn");

      const imageTrack = document.querySelector(".image-track");
      const imageList = document.querySelectorAll(".image-wrapper img");

      // 상태 변수 : 현재 보이는 이미지의 인덱스, 화면은 항상 이 값을 따라 간다.
      let currentIndex = 0;
      const imageCount = imageList.length; // 3;
      const bannerContainer = document.querySelector(".banner-container");
      let timerId = null;

      function startAutoSlide() {
        // 이미 돌고 있으면 또 만들지 않는다. 타이머가 두 개면 속도가 두 배가 됨
        if (timerId !== null) {
          return;
        }
        timerId = setInterval(() => {
          updateBanner((currentIndex + 1) % imageCount);
        }, 1000);
      }

      function stopAutoSlide() {
        clearInterval(timerId);
        timerId = null;
      }

      bannerContainer.addEventListener("mouseenter", stopAutoSlide);
      bannerContainer.addEventListener("mouseleave", startAutoSlide);

      // 1. 이전 버튼 리스너 등록
      prevButton.addEventListener("click", () => {
        let newIndex = (currentIndex - 1 + imageCount) % imageCount;
        console.log(newIndex);
        updateBanner(newIndex);
      });

      // 2. 다음 버튼 리스너 등록
      nextButton.addEventListener("click", () => {
        let newIndex = (currentIndex + 1) % imageCount;
        console.log(newIndex);
        updateBanner(newIndex);
      });

      function updateBanner(newIndex) {
        currentIndex = newIndex;
        imageTrack.style.transform = `translateX(-${currentIndex * 100}%)`;
      }
      startAutoSlide();
    </script>
  </body>
</html>
